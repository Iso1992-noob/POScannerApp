name: Build Native iOS App IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Project and Build IPA
      run: |
        # Dùng XcodeGen để cấu hình Auto-generate Info.plist
        cat << 'EOF' > project.yml
        name: POScannerApp
        options:
          bundlePrefix: com.scanner
          deploymentTarget:
            iOS: "16.0"
        targets:
          POScannerApp:
            type: application
            platform: iOS
            deploymentTarget: "16.0"
            sources:
              - path: .
                includes:
                  - "*.swift"
            settings:
              base:
                PRODUCT_BUNDLE_IDENTIFIER: com.scanner.poscannerapp
                SWIFT_VERSION: "5.0"
                IPHONEOS_DEPLOYMENT_TARGET: "16.0"
                # Bật tính năng tự động tạo file Info.plist chuẩn của Apple
                GENERATE_INFOPLIST_FILE: YES
                # Truyền quyền Camera trực tiếp vào file cấu hình
                INFOPLIST_KEY_NSCameraUsageDescription: "Ứng dụng cần quyền camera để tự động nhận diện mã PO."
        EOF

        xcodegen generate

        xcodebuild build \
          -project POScannerApp.xcodeproj \
          -scheme POScannerApp \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CONFIGURATION_BUILD_DIR=${{ github.workspace }}/build

    - name: Package to IPA
      run: |
        mkdir -p Payload
        cp -R build/POScannerApp.app Payload/
        zip -r POScannerApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: POScannerApp-IPA
        path: POScannerApp.ipa
