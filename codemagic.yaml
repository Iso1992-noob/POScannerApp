workflows:
  ios-swiftui-workflow:
    name: Build Native iOS App
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.scanner.poscannerapp
      xcode: latest
    scripts:
      - name: Generate Xcode Project & Build IPA
        script: |
          # 1. Tạo file dự án xcodeproj chuẩn tự động
          swift package init --type executable --name POScannerApp || true
          
          # 2. Biên dịch App Native iOS
          xcodebuild build \
            -project "POScannerApp.xcodeproj" \
            -scheme "POScannerApp" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=$CODEMAGIC_BUILD_DIR/build

      - name: Package to IPA Artifact
        script: |
          # 3. Đóng gói thành file IPA thành phẩm
          cd $CODEMAGIC_BUILD_DIR
          mkdir -p Payload
          cp -R build/*.app Payload/ 2>/dev/null || cp -R build/Release-iphoneos/*.app Payload/
          zip -r POScannerApp.ipa Payload
    artifacts:
      - *.ipa
