workflows:
  ios-swiftui-workflow:
    name: Build Native iOS App
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Generate Project and Build IPA
        script: |
          # 1. Tạo file cấu trúc Xcode Project chuẩn
          cat << 'EOF' > project.yml
          name: POScannerApp
          options:
            bundlePrefix: com.scanner
          targets:
            POScannerApp:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources: [POScannerApp]
              settings:
                GENERATE_INFOPLIST_FILE: NO
                INFOPLIST_FILE: POScannerApp/Info.plist
                PRODUCT_BUNDLE_IDENTIFIER: com.scanner.poscannerapp
          EOF

          # 2. Cài đặt xcodegen để tự sinh .xcodeproj
          brew install xcodegen
          codegen generate

          # 3. Biên dịch Release ứng dụng iOS
          xcodebuild build \
            -project POScannerApp.xcodeproj \
            -scheme POScannerApp \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=$CODEMAGIC_BUILD_DIR/build

      - name: Package to IPA
        script: |
          # 4. Đóng gói Payload chuẩn file .ipa
          cd $CODEMAGIC_BUILD_DIR
          mkdir -p Payload
          cp -R build/POScannerApp.app Payload/
          zip -r POScannerApp.ipa Payload

    artifacts:
      - "*.ipa"
